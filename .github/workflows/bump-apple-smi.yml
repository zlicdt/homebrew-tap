name: bump apple-smi

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest release tag + sha256
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zlicdt/apple-smi/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')

          sha=$(curl -fsSL -L \
            "https://github.com/zlicdt/apple-smi/releases/download/${tag}/apple-smi.sha256" \
            | awk '{print $1}')

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update Formula/apple-smi.rb
        run: |
          set -euo pipefail
          f="Formula/apple-smi.rb"

          perl -pi -e 's/^(\s*version\s+").*(")/${1}${{ steps.meta.outputs.version }}${2}/' "$f"
          perl -pi -e 's/^(\s*sha256\s+").*(")/${1}${{ steps.meta.outputs.sha }}${2}/' "$f"

          ruby -c "$f"

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/apple-smi.rb
            git commit -m "apple-smi ${{ steps.meta.outputs.tag }}"
            git push
          else
            echo "No changes."
          fi

